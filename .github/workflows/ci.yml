name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  web:
    name: Web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Unit tests (scene-core, editor)
        run: npm test
      - name: Lint web
        run: npm run lint -w @ai3d/web
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  api:
    name: API (ruff · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ../ai-orchestrator
      - name: Lint
        working-directory: services/api
        run: ruff check app tests
      - name: Tests
        working-directory: services/api
        run: python -m pytest -q

  orchestrator:
    name: Orchestrator (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./services/ai-orchestrator pytest
      - run: python -m pytest -q services/ai-orchestrator/tests

  render-worker:
    name: Render worker (scene build tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./services/render-worker pytest
      - run: python -m pytest -q services/render-worker/tests

  database:
    name: SQL migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai3dstudio
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create the Supabase-compatible auth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ai3dstudio -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text unique
          );
          create role authenticated;
          create role anon;
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          SQL
      - name: Apply migrations and seeds
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in database/migrations/*.sql database/seeds/*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d ai3dstudio -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Assert RLS is enabled everywhere
        env:
          PGPASSWORD: postgres
        run: |
          count=$(psql -h localhost -U postgres -d ai3dstudio -tAc \
            "select count(*) from pg_tables where schemaname='public' and rowsecurity=false")
          echo "tables without RLS: $count"
          test "$count" -eq 0
