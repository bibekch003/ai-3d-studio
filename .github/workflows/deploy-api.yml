name: Deploy API (container host)

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/ai-orchestrator/**"
      - "infrastructure/docker/Dockerfile.api"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build image and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deployment hook (optional)
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Note
        run: |
          echo "Image published. Point your container host at"
          echo "ghcr.io/${{ github.repository }}/api:${{ github.sha }}"
          echo "Rollback = redeploy the previous SHA tag."
